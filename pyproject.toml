[project]
name = "pbench"
version = "0.1.0"
description = "Harness porównawczy narzędzi do anonimizacji (benchmark Privatizera)"
readme = "README.md"
authors = [
    { name = "Legal Geek" }
]
requires-python = ">=3.12"
dependencies = [
    "arabic-reshaper>=3.0.1",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "olefile>=0.47",
    "openpyxl>=3.1.5",
    "phonenumbers>=9.0.42",
    "pikepdf>=10.17.0",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "python-bidi>=0.6.12",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "python-stdnum>=2.2",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
]

[project.scripts]
pbench-korpus = "pbench.korpus:main"
pbench-trudne = "pbench.trudne:main"
pbench-kontaminacja = "pbench.kontaminacja:main"
pbench-uruchom = "pbench.uruchom:main"
pbench-ocen = "pbench.ocen:main"
pbench-kalibruj = "pbench.kalibracja:main"
pbench-agreguj = "pbench.agregacja:main"
pbench-czas = "pbench.czas:main"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --dist loadgroup"
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "extract-msg>=0.58.0",
    "pdfminer-six>=20260107",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
]
raport = [
    "jinja2>=3.1",
    "markdown>=3.7",
    "matplotlib>=3.9",
    "pdfminer-six>=20260107",
    "playwright>=1.49",
]
