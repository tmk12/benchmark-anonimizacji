# Deklaracja uczestnika (czyta ją orkiestrator `pbench-uruchom`). Ogólny NER Flair `ner-multi` (grupa B, nie PII): poziom tylko tekst.
# Ruling R37: każdy uczestnik tekstowy biegnie na wszystkich 5 językach; `jezyki_oficjalne` = języki oficjalnie obsługiwane wg karty
# (sędzia oznacza dokumenty flagą `w_zakresie_oficjalnym` dla miary „w zakresie oficjalnym”).
poziomy = ["tekst"]
jezyki = ["pl", "en", "es", "de", "fr"]          # uruchamiamy na wszystkich 5 (ruling R37)
jezyki_oficjalne = ["en", "es", "de"]            # karta: en, de, nl, es (CoNLL-03/02); francuski „kind of works” – poza oficjalnymi
formaty = []
procesy = 2
timeout_s = 1800      # CPU, LSTM na osadzeniach znakowych: długie tabele (listy płac ~20 tys. znaków) najdłużej
start_timeout_s = 600
