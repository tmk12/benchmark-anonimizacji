[project]
name = "uczestnik-flair"
version = "0.1.0"
description = "Uczestnik benchmarku: Flair NER flair/ner-multi (ogólny NER, 4 klasy)"
requires-python = "==3.12.*"
dependencies = [
    "flair==0.15.1",
    "transformers==4.57.6",
    "torch==2.15.0",
    "sentencepiece==0.2.2",
    "protobuf==7.36.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
