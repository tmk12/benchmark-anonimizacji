# Deklaracja uczestnika (czyta ją orkiestrator `pbench-uruchom`). Ruling R37: każdy uczestnik biegnie na wszystkich 5 językach.
# Privatizer ma jeden model dla wszystkich języków dokumentów (profile językowe pl/en/es/de/fr), więc oficjalnie obsługuje wszystkie 5.
# Wariant aneksu (poza rankingami): jak privatizer-plik, ale w trybie „Maksymalna ochrona” (sensitivity=privacy, KWOTA włączona przez aplikację); poziom plik.
aneks = true
poziomy = ["plik"]
jezyki = ["pl", "en", "es", "de", "fr"]
jezyki_oficjalne = ["pl", "en", "es", "de", "fr"]
formaty = ["docx", "pdf", "skan", "xlsx", "pptx", "eml", "msg", "doc"]
procesy = 2
timeout_s = 900
start_timeout_s = 900
