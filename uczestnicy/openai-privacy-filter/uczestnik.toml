# Deklaracja uczestnika (czyta ją orkiestrator `pbench-uruchom`). Poziom: tylko tekst.
# Ruling R37: każdy uczestnik tekstowy biegnie na wszystkich 5 językach; `jezyki_oficjalne` = języki oficjalnie obsługiwane wg karty/dokumentacji
# (sędzia oznacza dokumenty flagą `w_zakresie_oficjalnym` dla miary „w zakresie oficjalnym”).
poziomy = ["tekst"]
jezyki = ["pl", "en", "es", "de", "fr"]          # uruchamiamy na wszystkich 5 (ruling R37)
jezyki_oficjalne = ["en"]  # karta: „Primarily English; selected multilingual robustness evaluation reported” (bez listy języków)
formaty = []
procesy = 2
timeout_s = 1800      # CPU, 1 wątek, obciążona maszyna: ~10-30 s na dokument 2 tys. znaków, tabele ~20 tys. znaków do ~200 s (z szybką warstwą MoE)
start_timeout_s = 900
