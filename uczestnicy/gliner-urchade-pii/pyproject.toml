[project]
name = "uczestnik-gliner-urchade-pii"
version = "0.1.0"
description = "Uczestnik benchmarku: GLiNER urchade/gliner_multi_pii-v1 (samodzielny, bez Presidio)"
requires-python = "==3.12.*"
dependencies = [
    "gliner==0.2.29",
    "transformers==4.57.6",
    "torch==2.15.0",
    "sentencepiece==0.2.2",
    "protobuf==7.36.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
