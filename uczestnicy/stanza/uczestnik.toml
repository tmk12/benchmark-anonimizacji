# Deklaracja uczestnika (czyta ją orkiestrator `pbench-uruchom`). Ogólny NER Stanza (nie PII): poziom tylko tekst.
# Ruling R37: każdy uczestnik tekstowy biegnie na wszystkich 5 językach; `jezyki_oficjalne` = języki oficjalnie obsługiwane wg karty/dokumentacji
# (sędzia oznacza dokumenty flagą `w_zakresie_oficjalnym` dla miary „w zakresie oficjalnym”).
poziomy = ["tekst"]
jezyki = ["pl", "en", "es", "de", "fr"]          # uruchamiamy na wszystkich 5 (ruling R37)
jezyki_oficjalne = ["pl", "en", "es", "de", "fr"]  # dokumentacja modeli NER Stanza: pl (NKJP), en (OntoNotes), es (CoNLL02), de (GermEval2014), fr (WikiNER)
formaty = []
procesy = 2
timeout_s = 1800      # CPU, 1 wątek, obciążona maszyna: ~85 s na dokument 2 tys. znaków, tabele ~20 tys. znaków do ~16 min
start_timeout_s = 600
