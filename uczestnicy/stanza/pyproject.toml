[project]
name = "uczestnik-stanza"
version = "0.1.0"
description = "Uczestnik benchmarku: Stanza (Stanford NLP) – ogólny NER (nie PII), pakiet default_accurate, 5 języków"
requires-python = "==3.12.*"
dependencies = [
    "stanza==1.15.0",
    "torch==2.15.0",
    "transformers==4.57.6",
    "peft==0.21.2",
    "sacremoses==0.2.0",
    "numpy==2.5.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
